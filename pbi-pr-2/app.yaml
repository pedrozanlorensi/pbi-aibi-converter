command: [
  "streamlit",
  "run",
  "app.py"
]

# Scopes minted into the user's OBO token by the Apps proxy. Used for
# every Databricks call EXCEPT lakeview.create / lakeview.publish (those
# two are gated on a `dashboards` scope that isn't exposed in the OBO
# catalog, so the app calls them with its service principal and
# transfers dashboard ownership to the user immediately afterward).
#
#   sql               - SQL warehouses + statement execution (warehouse
#                       picker, preview rendering, schema probing,
#                       layout validation queries).
#   dashboards.genie  - Genie space creation (optional "Create Genie
#                       space" action).
user_api_scopes:
  - sql
  - dashboards.genie

env:
  # Optional. If unset, the in-app warehouse picker shows every warehouse
  # the signed-in user has CAN_USE on; setting this just preselects one.
  # - name: DATABRICKS_WAREHOUSE_ID
  #   value: "<your-warehouse-id>"

  # Override the LLM endpoint name if you want a different model. The default
  # works on Databricks-hosted Foundation Model endpoints.
  - name: LLM_MODEL
    value: "databricks-claude-opus-4-6"

  # Optional. Workspace folder where published dashboards land.
  # Defaults to /Workspace/Shared/aibi_converter (created on first publish).
  # - name: DASHBOARD_PARENT_PATH
  #   value: "/Workspace/Shared/aibi_converter"
